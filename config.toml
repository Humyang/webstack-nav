baseURL               = "https://humyang.github.io/webstack-nav/"
languageCode          = "zh-CN"
title                 = "软件资源导航"
theme                 = "WebStack-Hugo"
preserveTaxonomyNames = true
disablePathToLower    = true
hasCJKLanguage        = true
publishDir            = "public"				# 站点静态文件保存目录


[params]
    author        = "yangxionggui"
    description   = "精选软件安装包与虚拟资料下载：剪映、CapCut 历史版本合集，AutoCAD 2007-2026 全版本，视频下载工具等，夸克网盘高速下载，即拍即发。"
    upload        = ""      # 左侧导航栏的"网站提交"
    about         = ""	          # 左侧导航栏的"关于导航"页面(./about)
    repository    = "https://github.com/Humyang/webstack-nav"  
    enablePreLoad = true					# 网站完全打开前预加载动画
    textPreLoad   = "资源导航"				# 预加载的动画文字, 只有当enablePreLoad=true时生效
    expandSidebar = false					# 默认展开左侧边导航栏
    logosPath     = "assets/images/logos"			# 网站每个导航地址logo存放地址
    defaultLogo   = "assets/images/logos/default.webp"		# logo图片资源不存在或者错误时, 默认显示的logo; 该参数如为空,将会一直加载对应的logo,直至成功
    nightMode     = false					# 默认站点为深色(夜间)模式
    yiyan         = true                         		# 默认启用一言服务
    fancybox      = true                                        # 使用 Fancybox 实现图片灯箱/放大功能

[params.seo]
    keywords       = '软件安装包,虚拟资料,剪映历史版本,CapCut下载,AutoCAD全版本,视频下载工具,资源导航,夸克网盘下载'
    baiduhmid       = ''	# 百度统计 hm.src 的 ID
    baiduSiteVer    = ''			# 百度HTML标签验证(baidu-site-verification)
    tj51laid        = ''                        		# 51.LA 网站统计
    tj51lack        = ''
    GoogleAdsClient = ''					# Google AdSense 

[params.qweather]
    key = ""

[params.images]
    favicon           = "assets/images/favicon.png"
    searchImageL      = "assets/images/bg-tech.jpg"		# 搜索部分浅色背景图
    searchImageD      = "assets/images/bg-tech.jpg"		# 搜索部分深色背景图
    logoExpandLight   = "assets/images/logo.png"
    logoExpandDark    = "assets/images/logo.png"
    logoCollapseLight = "assets/images/logo.png"
    logoCollapseDark  = "assets/images/logo.png"
    
[markup.goldmark.renderer]
    unsafe = true

[params.footer]
    copyright = '本站内容源自互联网，如有内容侵犯了你的权益，请联系删除相关内容 <br/>&copy; 2026 - {year} By 资源导航 | Powered by [WebStack-Hugo](https://github.com/shenweiyan/WebStack-Hugo)<br/>'
