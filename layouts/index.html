      { name: "AutoCAD 全版本 2007-2026", desc: "AutoCAD 2007-2026 全版本安装包合集", icon: "📐", url: "https://pan.quark.cn/s/625d01a28106?pwd=qVaP", category: ["设计软件"], sort: 5, added: "2026-09-20", badge: "¥2.99", colors: ["#ff5a5f", "#ff8a5f"] },
      { name: "视频下载神器合集", desc: "最新全平台视频下载工具（蝴蝶号等）", icon: "📥", url: QUARK, category: ["效率工具"], sort: 6, added: "2026-09-20", badge: "¥2.99", colors: ["#0ea5e9", "#38bdf8"] },
      { name: "iPhone Duo 折叠预览", desc: "折叠屏 3D 交互演示 · 双指手势操控", icon: "📱", url: "/iphone-duo-gesture/", category: ["效率工具"], sort: 7, added: "2026-09-23", colors: ["#111827", "#374151"] }
    ];

    const categoryConfig = [
      { id: "all", icon: "📦", title: "全部软件资源", categories: ["剪辑软件", "设计软件", "效率工具"] },
      { id: "edit", icon: "🎬", title: "剪辑软件", categories: ["剪辑软件"] },
      { id: "design", icon: "📐", title: "设计软件", categories: ["设计软件"] },
      { id: "tool", icon: "🧰", title: "效率工具", categories: ["效率工具"] }
    ];

    const engineMap = {
      baidu: "https://www.baidu.com/s?wd=",
      bing: "https://www.bing.com/search?q="
    };

    const state = { mode: "sort", engine: "local", keyword: "", expandedSections: new Set() };
    const categorySections = document.getElementById("categorySections");
    const searchInput = document.getElementById("searchInput");
    const searchResultNotice = document.getElementById("searchResultNotice");
    const searchResultText = document.getElementById("searchResultText");
    const clearSearchButton = document.getElementById("clearSearch");

    function escapeHTML(v) {
      return String(v).replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#039;");
    }
    function sortSites(items) {
      const list = [...items];
      if (state.mode === "random") list.sort(() => Math.random() - 0.5);
      else list.sort((a, b) => (Number(b.sort) || 0) - (Number(a.sort) || 0));
      return list;
    }
    function renderSiteCard(item, index) {
      const internal = String(item.url).startsWith("/");
      return `
        <a class="site-card" href="${escapeHTML(item.url)}"${internal ? "" : ` target="_blank" rel="noopener noreferrer"`}
           style="--logo-a:${escapeHTML(item.colors[0])};--logo-b:${escapeHTML(item.colors[1])}"
           data-name="${escapeHTML(item.name)}">
          <span class="site-logo">${escapeHTML(item.icon)}</span>
          <span class="site-info">
            <span class="site-name">${escapeHTML(item.name)}${item.badge ? `<span class="badge">${escapeHTML(item.badge)}</span>` : ""}</span>
            <span class="site-desc">${escapeHTML(item.desc)}</span>
          </span>
          <span class="tag-corner">${String(index + 1).padStart(2, "0")}</span>
        </a>`;
    }
    function getSectionSites(section) {
      return sortSites(siteData.filter(item => item.category.some(c => section.categories.includes(c))));
    }
    function renderSection(section, items) {
      const cards = items.length
        ? `<div class="cards">${items.map(renderSiteCard).join("")}</div>`
        : `<div class="section-empty">该分类暂无资源</div>`;
      return `
        <section class="section" id="${escapeHTML(section.id)}" data-section-id="${escapeHTML(section.id)}">
          <h2 class="section-title">
            <span class="section-title-main"><span>${escapeHTML(section.icon)}</span><span>${escapeHTML(section.title)}</span><span class="count">共 ${items.length} 个</span></span>
          </h2>
          ${cards}
        </section>`;
    }
    function renderSections() {
      const keyword = state.keyword.trim().toLowerCase();
      if (keyword) {
        const matches = sortSites(siteData.filter(item => `${item.name} ${item.desc} ${item.category.join(" ")}`.toLowerCase().includes(keyword)));
        categorySections.innerHTML = renderSection({ id: "search-results", icon: "🔎", title: `搜索结果：${state.keyword.trim()}` }, matches);
        searchResultText.textContent = `共找到 ${matches.length} 个资源`;
        searchResultNotice.classList.add("visible");
        return;
      }
      searchResultNotice.classList.remove("visible");
      categorySections.innerHTML = categoryConfig.map(s => renderSection(s, getSectionSites(s))).join("");
      updateActiveSideLinkFromHash();
    }
    function setActiveSideLink(id) {
      document.querySelectorAll(".side-link[data-section]").forEach(l => l.classList.toggle("active", l.dataset.section === id));
    }
    function scrollToSection(id) {
      if (state.keyword) { state.keyword = ""; searchInput.value = ""; renderSections(); }
      requestAnimationFrame(() => {
        const el = document.getElementById(id);
        if (!el) return;
        setActiveSideLink(id);
        el.scrollIntoView({ behavior: "smooth", block: "start" });
        try { history.replaceState(null, "", `#${id}`); } catch (e) {}
      });
    }
    function updateActiveSideLinkFromHash() {
      const h = location.hash.replace("#", "");
      if (categoryConfig.some(s => s.id === h)) setActiveSideLink(h);
    }

    document.getElementById("contentTabs").addEventListener("click", e => {
      const b = e.target.closest(".content-tab"); if (!b) return;
      document.querySelectorAll(".content-tab").forEach(i => i.classList.remove("active"));
      b.classList.add("active");
      state.mode = b.dataset.mode;
      renderSections();
    });
    document.getElementById("engineList").addEventListener("click", e => {
      const b = e.target.closest(".engine"); if (!b) return;
      document.querySelectorAll(".engine").forEach(i => i.classList.remove("active"));
      b.classList.add("active");
      state.engine = b.dataset.engine;
      searchInput.placeholder = state.engine === "local" ? "搜索本站资源，如：剪映 / AutoCAD" : "输入关键词，用搜索引擎查询";
    });
    document.getElementById("searchForm").addEventListener("submit", e => {
      e.preventDefault();
      const kw = searchInput.value.trim();
      if (!kw) { searchInput.focus(); return; }
      if (state.engine === "local") {
        state.keyword = kw; renderSections();
        document.getElementById("search-results")?.scrollIntoView({ behavior: "smooth", block: "start" });
      } else {
        window.open(engineMap[state.engine] + encodeURIComponent(kw), "_blank", "noopener");
      }
    });
    searchInput.addEventListener("input", () => {
      if (state.engine !== "local") return;
      state.keyword = searchInput.value; renderSections();
    });
    clearSearchButton.addEventListener("click", () => {
      state.keyword = ""; searchInput.value = ""; renderSections(); scrollToSection("all");
    });

    const noticeModal = document.getElementById("noticeModal");
    function openNotice() { noticeModal.classList.add("open"); document.body.style.overflow = "hidden"; }
    function closeNotice() { noticeModal.classList.remove("open"); document.body.style.overflow = ""; try { localStorage.setItem("navNoticeRead", "1"); } catch (e) {} }
    document.getElementById("modalClose").addEventListener("click", closeNotice);
    document.getElementById("modalConfirm").addEventListener("click", closeNotice);
    noticeModal.addEventListener("click", e => { if (e.target === noticeModal) closeNotice(); });
    try { if (!localStorage.getItem("navNoticeRead")) setTimeout(openNotice, 400); } catch (e) { setTimeout(openNotice, 400); }

    document.getElementById("hideAnnouncement").addEventListener("click", () => {
      document.getElementById("heroAnnouncement").style.display = "none";
    });

    const themeToggle = document.getElementById("themeToggle");
    const themeMedia = window.matchMedia("(prefers-color-scheme: dark)");
    function applyTheme(t) {
      const dark = t === "dark";
      document.documentElement.dataset.theme = dark ? "dark" : "light";
      themeToggle.textContent = dark ? "☀" : "☾";
    }
    applyTheme(document.documentElement.dataset.theme || (themeMedia.matches ? "dark" : "light"));
    themeToggle.addEventListener("click", () => {
      const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      try { localStorage.setItem("site-theme", next); } catch (e) {}
      applyTheme(next);
    });

    document.getElementById("backToTop").addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));

    const sidebarToggle = document.getElementById("sidebarToggle");
    sidebarToggle.addEventListener("click", () => {
      document.body.classList.toggle("sidebar-collapsed");
      const c = document.body.classList.contains("sidebar-collapsed");
      document.getElementById("sidebarToggleIcon").setAttribute("icon", c ? "lucide:sidebar-open" : "lucide:sidebar-close");
      try { localStorage.setItem("navSidebarCollapsed", c ? "1" : "0"); } catch (e) {}
    });
    try { if (localStorage.getItem("navSidebarCollapsed") === "1") document.body.classList.add("sidebar-collapsed"); } catch (e) {}
    document.getElementById("sidebarToggleIcon").setAttribute("icon", document.body.classList.contains("sidebar-collapsed") ? "lucide:sidebar-open" : "lucide:sidebar-close");

    const menuButton = document.getElementById("menuButton");
    const drawerMask = document.getElementById("drawerMask");
    menuButton.addEventListener("click", () => document.body.classList.toggle("drawer-open"));
    drawerMask.addEventListener("click", () => document.body.classList.remove("drawer-open"));
    document.querySelectorAll(".side-link").forEach(link => {
      link.addEventListener("click", e => {
        document.body.classList.remove("drawer-open");
        if (!link.dataset.section) return;
        e.preventDefault();
        scrollToSection(link.dataset.section);
      });
    });

    renderSections();
    document.addEventListener("keydown", e => {
      if (e.key === "Escape") { closeNotice(); document.body.classList.remove("drawer-open"); }
    });
  </script>
</body>
</html>
